services:
  redis-master:
    image: redis:latest
    container_name: redis-master
    ports:
      - "6379:6379"
      - "26379:26379"
    command: >
      sh -c "
      redis-server /etc/redis/redis.conf &
      until redis-cli ping; do sleep 1; done;
      sh /etc/redis/master-init.sh;
      redis-sentinel /etc/redis/sentinel.conf &
      wait
      "
    volumes:
      - ./redis/token_bucket.lua:/etc/redis/lua/token_bucket.lua
      - ./redis/master.conf:/etc/redis/redis.conf:ro
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
      - ./redis/master-init.sh:/etc/redis/master-init.sh:ro
    networks:
      - redisnet
    # 장애 상황 시뮬레이션을 위해 포트로 들어오는 패킷 DROP
    cap_add:
      - NET_ADMIN
      
  redis-replica1:
    image: redis:latest
    container_name: redis-replica1
    ports:
      - "6380:6379"
      - "26380:26379"
    depends_on:
      - redis-master
    volumes:
      - ./redis/replica.conf:/etc/redis/redis.conf:ro
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    command: >
      sh -c "
      redis-sentinel /etc/redis/sentinel.conf &
      redis-server /etc/redis/redis.conf
      "
    networks:
      - redisnet
    # 장애 상황 시뮬레이션을 위해 포트로 들어오는 패킷 DROP
    cap_add:
      - NET_ADMIN
    
  redis-replica2:
    image: redis:latest
    container_name: redis-replica2
    ports:
      - "6381:6379"
      - "26381:26379"
    depends_on:
      - redis-master
    volumes:
      - ./redis/replica.conf:/etc/redis/redis.conf:ro
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    command: >
      sh -c "
      redis-sentinel /etc/redis/sentinel.conf &
      redis-server /etc/redis/redis.conf
      "
    networks:
      - redisnet
    # 장애 상황 시뮬레이션을 위해 포트로 들어오는 패킷 DROP
    cap_add:
      - NET_ADMIN
      
  openresty1:
    image: openresty/openresty:1.27.1.2-0-bookworm-fat
    container_name: openresty1
    depends_on:
      - redis-master
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
    networks:
      - redisnet
      - proxynet
      
  openresty2:
    image: openresty/openresty:1.27.1.2-0-bookworm-fat
    container_name: openresty2
    depends_on:
      - redis-master
    ports:
      - "81:80"
    volumes:
      - ./nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
    networks:
      - redisnet
      - proxynet
      
networks:
  redisnet:
    driver: bridge
  proxynet:
    external: true