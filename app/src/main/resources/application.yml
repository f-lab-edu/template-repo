spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 1000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}

management:
  endpoints:
    web:
      exposure:
        include: prometheus
  metrics:
    enable:
      hikari: true

server:
  tomcat:
    threads:
      max: 1000