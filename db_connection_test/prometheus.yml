global:
  scrape_interval: 1s #Default is every 1 minute.
  evaluation_interval: 15s
  # scrape_timeout is set to the global default (10s).

scrape_configs:
  - job_name: "cadvisor"
    scrape_interval: 5s
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: "app"
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']